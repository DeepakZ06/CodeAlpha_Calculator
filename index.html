<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built with HTML, CSS and JavaScript.">
  <title>Calculator | Deepak Kumar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <header class="calc-header">
        <div>
          <p class="eyebrow">SIMPLE • FAST • RESPONSIVE</p>
          <h1>Calculator</h1>
        </div>
        <span class="status-dot" aria-label="Ready"></span>
      </header>

      <div class="display" aria-live="polite">
        <div id="expression" class="expression">0</div>
        <div class="result-row">
          <span class="result-label">RESULT</span>
          <output id="result" class="result">0</output>
        </div>
      </div>

      <div class="keypad" aria-label="Calculator buttons">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key utility" data-value="%">%</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key utility" data-action="sign">+/−</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
      <p class="keyboard-hint">Keyboard supported · Enter = · Esc = Clear · Backspace = Delete</p>
    </section>

    <footer class="footer">
      <span>Made with ♥ using HTML, CSS &amp; JavaScript</span>
      <strong>Created by Deepak Kumar</strong>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
